name: Squad backlog poll

# Detects repos in the mizcausevic-dev org that have a `v0.1-shipped` release
# tag but NO `v1.0-prod` tag — those are Codex-shipped repos awaiting Miz's
# hardening pass. If new candidates are found, opens (or updates) a tracking
# issue on this profile repo so the backlog is visible from the operator's
# default page on github.com.
#
# Why this exists: the "auto-poll every 5min" doctrine in MEMORY only works
# inside a single conversation session — across ContextCompact boundaries
# the poll cadence dies, and on 2026-06-04 evening one such manual sweep
# turned up 56 hidden hardenings that had accumulated for days. This workflow
# moves the poll to a scheduled GitHub Action so it survives session
# boundaries indefinitely.

on:
  schedule:
    - cron: '23 */4 * * *'  # every 4 hours, offset off the top
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: squad-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scan org for v0.1-shipped repos without v1.0-prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ORG=mizcausevic-dev
          mkdir -p /tmp/squad
          OUT=/tmp/squad/candidates.txt
          : > "$OUT"

          # List all non-archived repos (max 1000 — current org has ~600)
          gh repo list "$ORG" --limit 1000 --no-archived \
            --json name --jq '.[].name' > /tmp/squad/all_repos.txt
          TOTAL=$(wc -l < /tmp/squad/all_repos.txt)
          echo "Scanning $TOTAL non-archived repos..."

          # For each repo: check for v0.1-shipped tag, then absence of v1.0-prod
          # Uses the no-leading-slash gh-api path form (Git-Bash compat —
          # see feedback note, applies even on ubuntu but cheap insurance).
          while read -r repo; do
            # Fast path: try v0.1-shipped first; if absent, skip the second call.
            if gh api "repos/$ORG/$repo/releases/tags/v0.1-shipped" \
                 --jq '.tag_name' 2>/dev/null | grep -qx 'v0.1-shipped'; then
              if ! gh api "repos/$ORG/$repo/releases/tags/v1.0-prod" \
                   --jq '.tag_name' 2>/dev/null | grep -qx 'v1.0-prod'; then
                echo "$repo" >> "$OUT"
              fi
            fi
          done < /tmp/squad/all_repos.txt

          N=$(wc -l < "$OUT" | awk '{print $1}')
          echo ""
          echo "=== Squad backlog: $N repos awaiting v1.0-prod harden ==="
          [ "$N" -gt 0 ] && head -20 "$OUT" || echo "(none — backlog clean)"

          # Emit count + list for next step
          echo "BACKLOG_COUNT=$N" >> "$GITHUB_ENV"
          # GitHub Actions doesn't handle multi-line env vars cleanly; use a file
          cp "$OUT" /tmp/squad/backlog.txt

      - name: Find or open tracking issue
        if: env.BACKLOG_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=mizcausevic-dev/mizcausevic-dev
          TITLE_PREFIX='[squad-poll] Backlog: repos awaiting v1.0-prod harden'
          N=$BACKLOG_COUNT
          BODY_FILE=/tmp/squad/issue_body.md

          # Build issue body — list each candidate as a checklist + how to harden
          {
            echo "**Auto-generated by .github/workflows/squad-poll.yml** — fires every 4 hours."
            echo ""
            echo "These repos have a \`v0.1-shipped\` release tag (Codex shipped) but no \`v1.0-prod\` (hardening not done)."
            echo ""
            echo "Last scan: \`$(date -u +%Y-%m-%dT%H:%MZ)\` — $N repo(s) outstanding."
            echo ""
            echo "## Candidates"
            echo ""
            while read -r r; do
              echo "- [ ] [$r](https://github.com/mizcausevic-dev/$r/releases) — \`gh release create v1.0-prod --repo mizcausevic-dev/$r --title v1.0-prod --notes \"Hardened to v1.0-prod\"\`"
            done < /tmp/squad/backlog.txt
            echo ""
            echo "## Standard hardening checklist"
            echo "1. Confirm CI is green (\`gh run list --repo mizcausevic-dev/REPO -L 1\`)"
            echo "2. Verify AGPL-3.0 LICENSE present"
            echo "3. Verify \`.github/dependabot.yml\` exists"
            echo "4. Verify any workflow \`uses:\` lines are SHA-pinned (3rd-party actions)"
            echo "5. Create the \`v1.0-prod\` release"
            echo ""
            echo "<sub>This issue is updated in-place by the next poll run; it never closes itself when the backlog is empty (the issue will simply state 0 candidates).</sub>"
          } > "$BODY_FILE"

          # Find existing open issue with the matching title prefix
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE_PREFIX\"" \
                       --json number,title --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --repo "$REPO" \
              --title "$TITLE_PREFIX ($N outstanding)" \
              --body-file "$BODY_FILE"
            echo "Updated #$EXISTING with $N candidates"
          else
            echo "Opening new tracking issue"
            gh issue create --repo "$REPO" \
              --title "$TITLE_PREFIX ($N outstanding)" \
              --body-file "$BODY_FILE" \
              --label "squad-backlog" 2>&1 | tail -1
          fi

      - name: Close tracking issue if backlog is empty
        if: env.BACKLOG_COUNT == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=mizcausevic-dev/mizcausevic-dev
          TITLE_PREFIX='[squad-poll] Backlog: repos awaiting v1.0-prod harden'
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE_PREFIX\"" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Backlog clean — closing tracking issue #$EXISTING"
            gh issue close "$EXISTING" --repo "$REPO" \
              --comment "Squad backlog is empty as of $(date -u +%Y-%m-%dT%H:%MZ). Will re-open if new \`v0.1-shipped\` tags land without \`v1.0-prod\`."
          else
            echo "Backlog clean and no open tracking issue — nothing to do."
          fi
