name: Sync canonical splices into README

# Profile READMEs render instantly on push to main — no deploy step exists.
# This workflow fetches the apex canonical (kineticgain.com publishes
# kinetic-gain-canonical.json publicly via its own FTP deploy), rebuilds the
# splice payloads inline from canonical fields, applies them to README.md
# between BEGIN/END markers, and commits + pushes only if anything changed.
# Numbers can't drift from canonical.
#
# Architecture: public-URL fetch (matches kinetic-gain-suite-landing and
# mizcausevic-dev.github.io). The public web contract IS the cross-repo
# interface — no PAT secret, no private-repo dependency, no apex-clone.

on:
  schedule:
    - cron: '17 */6 * * *'  # every 6 hours, offset off the top to avoid GH cron herd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-canonical
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Fetch canonical + apply splices
        run: |
          # Real Chrome UA — Hostinger's edge WAF returns 403 to default curl UA
          # on GitHub Actions IPs. Same UA pattern used by other consumer repos.
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          mkdir -p /tmp/canonical
          if ! curl -sS -f -A "$UA" -H 'Accept: application/json' \
                  https://kineticgain.com/kinetic-gain-canonical.json \
                  -o /tmp/canonical/kg.json; then
            echo "WARN: canonical fetch failed — skipping splice (README stays at last-known-good)."
            exit 0
          fi

          python3 <<'PY'
          import json, pathlib

          C = json.loads(pathlib.Path("/tmp/canonical/kg.json").read_text(encoding="utf-8"))
          S = C["headline_stats"]
          PLATS = C["named_platforms"]
          SEC = C.get("security_stats", {})

          # ---- Splice payload 1: estate-block (table of named platforms) ----
          # Mirrors generate.py readme_block() — kept in sync with apex's emitter.
          rows = "\n".join(f"| {p['name']} | {p['count']} |" for p in PLATS)
          membership_sum = sum(p["count"] for p in PLATS)
          estate_block = (
              "<!-- GENERATED from canonical.json — do not hand-edit -->\n"
              f"### Kinetic Gain estate\n\n"
              f"{S['public_repos']} public repos · "
              f"{S['live_properties']} live properties · "
              f"{S['open_specs']} open specs · "
              f"{S['verticals']} verticals\n\n"
              f"| Named platform | Repos |\n"
              f"|---|---|\n"
              f"{rows}\n\n"
              f"> Counts are platform cluster sizes; a repo may belong to several platforms, "
              f"so they sum to {membership_sum} membership-slots across "
              f"{S['public_repos']} distinct repos."
          )

          # ---- Splice payload 2: security-stats-inline ----
          # Mirrors generate.py security_stats_inline_md().
          if SEC:
              security_block = (
                  "<!-- GENERATED from canonical.json — do not hand-edit -->\n"
                  f"Dependabot on **{SEC['dependabot_repos']} repos** · "
                  f"CodeQL on **{SEC['codeql_repos']}** · "
                  f"OpenSSF Scorecard on **{SEC['scorecard_repos']}** "
                  "(strict subset of CodeQL) · "
                  f"SHA-pinned actions across **{SEC['sha_pinned_uses_lines']} `uses:` lines** "
                  f"(measured {SEC['measured']})."
              )
          else:
              security_block = "<!-- GENERATED — security_stats absent from canonical -->"

          SPLICES = [
              ("<!-- BEGIN GENERATED estate-block",          "<!-- END GENERATED estate-block -->",          estate_block),
              ("<!-- BEGIN GENERATED security-stats-inline", "<!-- END GENERATED security-stats-inline -->", security_block),
          ]

          readme = pathlib.Path("README.md")
          src = readme.read_text(encoding="utf-8")
          changed = 0
          for begin_prefix, end_marker, payload in SPLICES:
              i = src.find(begin_prefix)
              j = src.find(end_marker, i)
              if i < 0 or j < 0:
                  raise SystemExit(f"FAIL: markers missing for {begin_prefix}: begin={i} end={j}")
              i_end_of_begin = src.find("-->", i) + len("-->")
              before = src
              src = src[:i_end_of_begin] + "\n" + payload + "\n" + src[j:]
              if src != before:
                  changed += 1
                  print(f"OK: spliced {len(payload)} bytes")
              else:
                  print(f"OK: {begin_prefix} already in sync")
          readme.write_text(src, encoding="utf-8", newline="\n")
          print(f"OK: wrote README.md ({changed} splices changed)")
          PY

      - name: Commit + push if changed
        run: |
          git config user.email "noreply@kineticgain.com"
          git config user.name "Kinetic Gain Bot"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore(sync): refresh README splices from canonical [skip ci]"
            git push origin main
            echo "Pushed canonical-splice refresh."
          else
            echo "No changes — canonical already in sync."
          fi
